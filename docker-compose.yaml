services:
  # test:
  #   image: comfy:11
  #   command: nvidia-smi
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]
  comfy_pre:
    container_name: comfy_pre
    tty: true
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    image: comfy:15
    environment:
      - ENV=${ENV}
      - MALIANG_TASK_CALLBACK=${MALIANG_TASK_CALLBACK}

    volumes:
      - ../comfy_models:/root/comfyui_info/ComfyUI/models:cached
      - ./custom_nodes:/root/comfyui_info/ComfyUI/custom_nodes:cached
      - ./queues:/root/comfyui_info/ComfyUI/queues:cached
      - ../comfyui_input/comfy_pre:/root/comfyui_info/ComfyUI/input:delegated
      - ../comfyui_output/comfy_pre:/root/comfyui_info/ComfyUI/output:delegated
    ports:
      - "9099:8188"
    command: [ "python3.10", "main.py", "--listen=0.0.0.0", "--queue_name=ExamplePromptQueue" ]
